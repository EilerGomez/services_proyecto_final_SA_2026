server:
  port: 8088

spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_cartera}
    username: ${DB_USER:usr_cartera}
    password: ${DB_PASSWORD:cambiar_cartera}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC           # la BD guarda UTC; la hora local solo se muestra

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    exchange: wallet.eventos              # publica CarteraDebitada, DebitoCarteraRechazado, CarteraReembolsada
    cola: wallet.q                        # DLQ: wallet.q.dlq
    suscripciones:
      "[sales.eventos]": [DebitoCarteraSolicitado, ReembolsoCarteraSolicitado]
      "[identity.eventos]": [CuentaCreada]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  servicios:
    identity-url: ${IDENTITY_URL:http://localhost:8081}   # R4c: estado de la cuenta antes de debitar
  pagos:
    # Pasarela con la que se cobran las recargas. "simulado" aprueba todo (desarrollo y calificación).
    # Para una pasarela real se agrega otra implementación de ProveedorPagos y se cambia este valor.
    proveedor: ${PAGOS_PROVEEDOR:simulado}

springdoc:
  api-docs:
    path: /wallet/v3/api-docs
  swagger-ui:
    path: /wallet/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
