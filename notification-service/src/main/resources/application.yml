server:
  port: 8087

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_notificaciones}
    username: ${DB_USER:usr_notificaciones}
    password: ${DB_PASSWORD:cambiar_notificaciones}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC           # la BD guarda UTC; la hora local solo se muestra

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}          # true con Gmail
          starttls:
            enable: ${MAIL_STARTTLS:false}  # true con Gmail
# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    # sin exchange: este servicio no publica eventos
    cola: notification.q
    suscripciones:
      "[identity.eventos]": [CuentaCreada, RecuperacionContrasenaSolicitada, CodigoDobleFactorSolicitado, RolAsignado]
      "[fleet.eventos]": [LicenciaChoferActualizada]
      "[trips.eventos]": [CotizacionAlquilerConfirmada, AlquilerAsignado, RutaActualizada, ViajeReasignado, ViajeProgramado]
      "[sales.eventos]": [BoletoVendido, VentaCancelada, VentaReembolsada, AlquilerPagado, BoletoReasignado]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  servicios:
    identity-url: ${IDENTITY_URL:http://localhost:8081}
  recordatorios:
    cron: ${RECORDATORIOS_CRON:0 0 7 * * *}            # todos los días a las 7:00 (hora de Guatemala)
    habilitado: ${RECORDATORIOS_HABILITADO:true}

springdoc:
  api-docs:
    path: /notifications/v3/api-docs
  swagger-ui:
    path: /notifications/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info