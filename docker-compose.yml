# =====================================================================
# docker-compose.yml · services_proyecto_final_SA_2026
# PostgreSQL NO está aquí: corre fuera de Docker en cada máquina / VM.
#
# Desarrollo local (servicios desde NetBeans):
#   docker compose up -d                       -> solo RabbitMQ y Mailpit
# Todo en Docker (primero se arman los JAR sin pruebas):
#   mvn -B -ntp -Pdespliegue package
#   docker compose --profile app up -d --build
# VM, dos entornos:
#   docker compose -p dev  --env-file .env.dev  --profile app up -d
#   docker compose -p prod --env-file .env.prod --profile app up -d
#   (ver infra/README.md)
# =====================================================================

name: proyecto2

# ---------- Configuración común de los servicios Java ----------
x-env-comun: &env-comun
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  RABBIT_HOST: rabbitmq
  RABBIT_USER: ${RABBIT_USER:-proyecto2}
  RABBIT_PASSWORD: ${RABBIT_PASSWORD:-proyecto2}
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env}
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -XX:+UseSerialGC"

x-servicio-java: &servicio-java
  profiles: ["app"]
  restart: unless-stopped
  mem_limit: 400m
  extra_hosts:
    - "host.docker.internal:host-gateway"   # para llegar al PostgreSQL de la máquina
  depends_on:
    rabbitmq:
      condition: service_healthy

services:

  # ---------- Infraestructura ----------
  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    mem_limit: 300m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-proyecto2}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-proyecto2}
    ports:
      - "127.0.0.1:${RABBIT_PORT:-5672}:5672"        # servicios corriendo desde NetBeans
      - "127.0.0.1:${RABBIT_UI_PORT:-15672}:15672"   # panel web (en la VM, por túnel SSH)
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:                                  # buzón de prueba: captura los correos sin enviarlos
    image: axllent/mailpit
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # ---------- Entrada única ----------
  api-gateway:
    <<: *servicio-java
    build: ./api-gateway
    image: ${REGISTRY:-ghcr.io/usuario}/api-gateway:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:5173}
      IDENTITY_URL: http://identity-service:8081
      FLEET_URL: http://fleet-service:8082
      TRIPS_URL: http://trips-service:8083
      SALES_URL: http://sales-service:8084
      MAINTENANCE_URL: http://maintenance-service:8085
      REPORTING_URL: http://reporting-service:8086
      NOTIFICATION_URL: http://notification-service:8087
      # Valida el JWT de identity (mismo JWT_SECRET). Solo poner false en desarrollo.
      GATEWAY_SECURITY_ENABLED: ${GATEWAY_SECURITY_ENABLED:-true}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"        # el único puerto público de la aplicación

  # ---------- Microservicios ----------
  # DB_USER / DB_PASSWORD: el usuario dueño de cada base (00_crear_bases.sql). Se pueden cambiar en el .env.
  identity-service:
    <<: *servicio-java
    build: ./identity-service
    image: ${REGISTRY:-ghcr.io/usuario}/identity-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_identidad${DB_SUFIJO:-}
      DB_USER: ${DB_IDENTIDAD_USER:-usr_identidad}
      DB_PASSWORD: ${DB_IDENTIDAD_PASSWORD:-cambiar_identidad}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Login con Google (opcional; sin estas dos el endpoint responde 503 y todo lo demás igual).
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Debe coincidir con una "Authorized redirect URI" de la credencial (vía gateway).
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/identity/auth/oauth2/google/callback}
      # Frontend al que vuelve el callback con ?ticket= o ?error=.
      OAUTH_FRONTEND_URL: ${OAUTH_FRONTEND_URL:-http://localhost:4200}
      # Admin inicial (solo se crea si no hay ningún ADMIN_SISTEMA). NIT y DPI son únicos en perfiles:
      # no usar "CF" como NIT del admin, o ningún otro usuario podría registrarse con CF.
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-}
      ADMIN_NOMBRES: ${ADMIN_NOMBRES:-Administrador}
      ADMIN_APELLIDOS: ${ADMIN_APELLIDOS:-Sistema}
      ADMIN_NIT: ${ADMIN_NIT:-1000000-1}
      ADMIN_DPI: ${ADMIN_DPI:-0000000000000}
      ADMIN_TELEFONO: ${ADMIN_TELEFONO:-00000000}
      ADMIN_DIRECCION: ${ADMIN_DIRECCION:-Ciudad}
      FOTOS_BUCKET: ${FOTOS_BUCKET:-proyecto-final-sa-fotos}
      FOTOS_PREFIJO: ${FOTOS_PREFIJO:-}

  fleet-service:
    <<: *servicio-java
    build: ./fleet-service
    image: ${REGISTRY:-ghcr.io/usuario}/fleet-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_flota${DB_SUFIJO:-}
      DB_USER: ${DB_FLOTA_USER:-usr_flota}
      DB_PASSWORD: ${DB_FLOTA_PASSWORD:-cambiar_flota}
      IDENTITY_URL: http://identity-service:8081   # R5
      TRIPS_URL: http://trips-service:8083         # R3
      FOTOS_BUCKET: ${FOTOS_BUCKET:-proyecto-final-sa-fotos}
      FOTOS_PREFIJO: ${FOTOS_PREFIJO:-}

  trips-service:
    <<: *servicio-java
    build: ./trips-service
    image: ${REGISTRY:-ghcr.io/usuario}/trips-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_viajes${DB_SUFIJO:-}
      DB_USER: ${DB_VIAJES_USER:-usr_viajes}
      DB_PASSWORD: ${DB_VIAJES_PASSWORD:-cambiar_viajes}
      FLEET_URL: http://fleet-service:8082         # R1a y R1b

  sales-service:
    <<: *servicio-java
    build: ./sales-service
    image: ${REGISTRY:-ghcr.io/usuario}/sales-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_ventas${DB_SUFIJO:-}
      DB_USER: ${DB_VENTAS_USER:-usr_ventas}
      DB_PASSWORD: ${DB_VENTAS_PASSWORD:-cambiar_ventas}
      TRIPS_URL: http://trips-service:8083         # R2

  maintenance-service:
    <<: *servicio-java
    build: ./maintenance-service
    image: ${REGISTRY:-ghcr.io/usuario}/maintenance-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_mantenimiento${DB_SUFIJO:-}
      DB_USER: ${DB_MANTENIMIENTO_USER:-usr_mantenimiento}
      DB_PASSWORD: ${DB_MANTENIMIENTO_PASSWORD:-cambiar_mantenimiento}

  reporting-service:
    <<: *servicio-java
    build: ./reporting-service
    image: ${REGISTRY:-ghcr.io/usuario}/reporting-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_reportes${DB_SUFIJO:-}
      DB_USER: ${DB_REPORTES_USER:-usr_reportes}
      DB_PASSWORD: ${DB_REPORTES_PASSWORD:-cambiar_reportes}

  notification-service:
    <<: *servicio-java
    build: ./notification-service
    image: ${REGISTRY:-ghcr.io/usuario}/notification-service:${IMAGE_TAG:-latest}
    environment:
      <<: *env-comun
      DB_NAME: bd_notificaciones${DB_SUFIJO:-}
      DB_USER: ${DB_NOTIFICACIONES_USER:-usr_notificaciones}
      DB_PASSWORD: ${DB_NOTIFICACIONES_PASSWORD:-cambiar_notificaciones}
      IDENTITY_URL: http://identity-service:8081   # R4 (recordatorios de licencia)
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}

volumes:
  rabbit_data: