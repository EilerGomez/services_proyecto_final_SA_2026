server:
  port: 8085

spring:
  application:
    name: maintenance-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_mantenimiento}
    username: ${DB_USER:usr_mantenimiento}
    password: ${DB_PASSWORD:cambiar_mantenimiento}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    exchange: maintenance.eventos            # publica en este exchange (outbox)
    cola: maintenance.q
    suscripciones:
      "[fleet.eventos]": [BusCreado, BusActualizado, BusDesactivado]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info