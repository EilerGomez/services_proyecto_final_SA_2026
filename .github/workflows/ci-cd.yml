# =====================================================================
# CI/CD · services_proyecto_final_SA_2026
#
# Pull Request a develop/main -> compila y corre TODAS las pruebas (mvn verify, incluye JaCoCo de comun).
# Push (merge) a develop      -> compila y corre todas las pruebas (no despliega).
# Push (merge) a main         -> por cada servicio que cambió: pruebas, imagen :latest y despliegue en PRODUCCIÓN.
# Manual (Actions → Run workflow, rama main) -> despliega TODOS los servicios en producción.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   VM_HOST     IP externa de la VM de Google Cloud
#   VM_USER     deploy
#   VM_SSH_KEY  llave PRIVADA ed25519 cuya pública está en /home/deploy/.ssh/authorized_keys
# =====================================================================
name: CI/CD servicios

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # publicar imágenes en ghcr.io

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  pruebas:
    name: Pruebas
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar todo el repositorio
        run: mvn -B verify

  # ------------------------------------------------------------------
  cambios:
    name: Detectar servicios modificados
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ github.event_name == 'workflow_dispatch' && steps.todos.outputs.lista || steps.filtro.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Todos los servicios (ejecución manual)
        id: todos
        run: echo 'lista=["api-gateway","identity-service","fleet-service","trips-service","sales-service","maintenance-service","reporting-service","notification-service"]' >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          # comun y el POM padre afectan a todos los servicios
          filters: |
            api-gateway:          ['api-gateway/**', 'pom.xml', 'docker-compose.yml']
            identity-service:     ['identity-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            fleet-service:        ['fleet-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            trips-service:        ['trips-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            sales-service:        ['sales-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            maintenance-service:  ['maintenance-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            reporting-service:    ['reporting-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']
            notification-service: ['notification-service/**', 'comun/**', 'pom.xml', 'docker-compose.yml']

  # ------------------------------------------------------------------
  desplegar:
    name: Desplegar ${{ matrix.servicio }}
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]' && needs.cambios.outputs.servicios != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    env:
      SERVICIO: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Pruebas y empaquetado (servicio + comun)
        run: mvn -B -pl "$SERVICIO" -am verify

      - name: Entorno de producción
        run: |
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "ENTORNO=prod" >> "$GITHUB_ENV"
          echo "TAG=latest"   >> "$GITHUB_ENV"

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        run: |
          IMAGEN="$REGISTRY/$SERVICIO"
          docker build -t "$IMAGEN:$TAG" -t "$IMAGEN:$GITHUB_SHA" "$SERVICIO"
          docker push --all-tags "$IMAGEN"

      - name: Preparar SSH hacia la VM
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar en la VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DESTINO="$VM_USER@$VM_HOST"
          # 1. docker-compose.yml siempre actualizado desde el repo
          scp docker-compose.yml "$DESTINO:/opt/proyecto2/docker-compose.yml"
          # 2. login en ghcr.io con el token temporal de este job (por stdin, no queda en el historial)
          printf '%s' "$GHCR_TOKEN" | ssh "$DESTINO" "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          # 3. RabbitMQ arriba (no hace nada si ya está) y reemplazo SOLO del servicio cambiado
          ssh "$DESTINO" "cd /opt/proyecto2 && \
            docker compose -p $ENTORNO --env-file .env.$ENTORNO up -d rabbitmq mailpit && \
            docker compose -p $ENTORNO --env-file .env.$ENTORNO --profile app pull $SERVICIO && \
            docker compose -p $ENTORNO --env-file .env.$ENTORNO --profile app up -d --no-deps $SERVICIO && \
            docker image prune -f"
