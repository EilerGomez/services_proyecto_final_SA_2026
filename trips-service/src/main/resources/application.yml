server:
  port: 8083

spring:
  application:
    name: trips-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_viajes}
    username: ${DB_USER:usr_viajes}
    password: ${DB_PASSWORD:cambiar_viajes}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo.
# Publica: RutaCreada, RutaActualizada, RutaEliminada, ViajeProgramado, ViajeActualizado,
#          ViajeEliminado, ViajeReasignado, ViajeIniciado, ViajeCompletado, CotizacionAlquilerConfirmada,
#          AlquilerAsignado, AlquilerCancelado
comun:
  eventos:
    exchange: trips.eventos            # publica en este exchange (outbox → RelayOutbox)
    cola: trips.q                      # consume de esta cola (DLQ: trips.q.dlq)
    suscripciones:
      "[fleet.eventos]": [SucursalCreada, SucursalActualizada, BusCreado, BusActualizado, BusDesactivado,
                          ChoferCreado, ChoferActualizado, ChoferDesactivado]
      "[identity.eventos]": [TarifaDepreciacionCambiada, ClienteRegistrado, PerfilActualizado]
      "[sales.eventos]": [AlquilerPagado, TarifaReembolsoCambiada]
 
app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  servicios:
    fleet-url: ${FLEET_URL:http://localhost:8082}     # R1a y R1b

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"