server:
  port: 8084

spring:
  application:
    name: sales-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_ventas}
    username: ${DB_USER:usr_ventas}
    password: ${DB_PASSWORD:cambiar_ventas}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    exchange: sales.eventos            # publica en este exchange (outbox → RelayOutbox)
    cola: sales.q                      # consume de esta cola (DLQ: sales.q.dlq)
    suscripciones:
      "[trips.eventos]": [ViajeProgramado, ViajeActualizado, ViajeIniciado, ViajeEliminado,
                          ViajeReasignado, CotizacionAlquilerConfirmada, AlquilerCancelado]
      "[identity.eventos]": [ClienteRegistrado, PerfilActualizado]
      "[wallet.eventos]": [CarteraDebitada, DebitoCarteraRechazado, CarteraReembolsada]   # saga de pago con cartera

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  servicios:
    trips-url: ${TRIPS_URL:http://localhost:8083}   # R2: ¿se puede vender este viaje?
  ventas:
    minutos-reserva: 5                              # S2: cuánto dura el bloqueo de asientos en línea
    liberar-reservas-ms: 30000                      # tarea que libera reservas vencidas

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info