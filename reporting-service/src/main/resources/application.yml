server:
  port: 8086

spring:
  application:
    name: reporting-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_reportes}
    username: ${DB_USER:usr_reportes}
    password: ${DB_PASSWORD:cambiar_reportes}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    # sin exchange: este servicio no publica eventos
    cola: reporting.q
    suscripciones:
      "[identity.eventos]": [TarifaDepreciacionCambiada]
      "[fleet.eventos]": [SucursalCreada, SucursalActualizada, BusCreado, BusActualizado, BusDesactivado, ChoferCreado, ChoferActualizado, ChoferDesactivado]
      "[trips.eventos]": [RutaCreada, RutaActualizada, RutaEliminada, ViajeProgramado, ViajeActualizado, ViajeEliminado, ViajeIniciado, ViajeCompletado]
      "[sales.eventos]": [BoletoVendido, VentaCancelada, AlquilerPagado]
      "[maintenance.eventos]": [GastoTallerRegistrado, CategoriaGastoActualizada]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info