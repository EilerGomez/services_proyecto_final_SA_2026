server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_identidad}
    username: ${DB_USER:usr_identidad}
    password: ${DB_PASSWORD:cambiar_identidad}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC           # la BD guarda UTC; la hora local solo se muestra

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
comun:
  eventos:
    exchange: identity.eventos            # publica en este exchange (outbox)
    cola: identity.q
    suscripciones:
      # La cartera (débito/reembolso de la saga con Sales) ahora es wallet-service
      "[fleet.eventos]": [ChoferDesactivado, PersonalSucursalAsignado, PersonalSucursalDesactivado]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  oauth2:
    google:
      # Credenciales OAuth de Google (consola cloud, tipo Web). Vacías = login con Google apagado.
      client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
      # Debe coincidir con una "Authorized redirect URI" de la credencial (vía gateway).
      redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/identity/auth/oauth2/google/callback}
      # Frontend al que vuelve el callback con ?ticket= o ?error=.
      frontend-url: ${OAUTH_FRONTEND_URL:http://localhost:4200}
  fotos:
    # Azure Blob Storage. URL de cada foto: <cuenta-url>/<contenedor>/<prefijo><carpeta>/<uuid>.<ext>
    cuenta-url: ${FOTOS_CUENTA_URL:https://stproyecto2fotos.blob.core.windows.net}
    contenedor: ${FOTOS_CONTENEDOR:fotos}
    prefijo: ${FOTOS_PREFIJO:dev/}
    # Solo en local: token SAS del contenedor (crear + escribir, con vencimiento). Nunca en el repo ni en .env.prod.
    # Vacío (en la VM de Azure): se usa la identidad administrada de la VM.
    sas: ${FOTOS_SAS:}

springdoc:
  api-docs:
    path: /identity/v3/api-docs
  swagger-ui:
    path: /identity/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info