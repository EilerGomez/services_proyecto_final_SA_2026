server:
  port: 8082

spring:
  application:
    name: fleet-service
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:bd_flota}
    username: ${DB_USER:usr_flota}
    password: ${DB_PASSWORD:cambiar_flota}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # las tablas las crea Flyway, Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:proyecto2}
    password: ${RABBIT_PASSWORD:proyecto2}
    publisher-confirm-type: correlated
    listener:
      simple:
        default-requeue-rejected: false   # al agotar reintentos -> DLQ
        retry:
          enabled: true
          max-attempts: 4                 # 1 intento + 3 reintentos (1 s, 2 s, 4 s)
          initial-interval: 1000
          multiplier: 2

# Eventos (módulo comun): exchange propio, cola propia y suscripciones del catálogo
# Publica: SucursalCreada, SucursalActualizada, PersonalSucursalAsignado, PersonalSucursalDesactivado,
#          BusCreado, BusActualizado, BusDesactivado, ChoferCreado, ChoferActualizado,
#          ChoferDesactivado, LicenciaChoferActualizada
comun:
  eventos:
    exchange: fleet.eventos            # publica en este exchange (outbox)
    cola: fleet.q
    suscripciones:
      "[identity.eventos]": [PerfilActualizado]
      "[trips.eventos]": [ViajeIniciado, ViajeCompletado]

app:
  jwt:
    duracion-minutos: 60
    secret: ${JWT_SECRET:solo-desarrollo-cambiar-este-secreto-de-32-caracteres}
  servicios:
    identity-url: ${IDENTITY_URL:http://localhost:8081}
    trips-url: ${TRIPS_URL:http://localhost:8083}
  fotos:
    bucket: ${FOTOS_BUCKET:proyecto-final-sa-fotos}
    prefijo: ${FOTOS_PREFIJO:dev/}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
        

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"